[project]
name = "resume-tailor"
version = "0.0.1"
description = "Tailor a one-page LaTeX resume to a job listing from a master content bank."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tailor"
module-root = "server"

[tool.pytest.ini_options]
testpaths = ["server/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["server"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "server"
packages = ["tailor"]
